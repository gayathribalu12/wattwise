services:

  prometheus:
    image: prom/prometheus:latest
    container_name: wattwise-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: wattwise-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: wattwise-node-exporter
    ports:
      - "9100:9100"
  cpu-worker:
    build:
      context: ./workloads/cpu_worker
    container_name: wattwise-cpu-worker
